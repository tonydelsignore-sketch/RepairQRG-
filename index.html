<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepairQRG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="viewport">
      <section class="phone">
        <div class="status-bar">
          <span>9:41</span>
          <div class="status-icons" aria-hidden="true">
            <span class="signal"></span>
            <span class="wifi"></span>
            <span class="battery"></span>
          </div>
        </div>
        <div class="hero">
          <div class="hero-image" role="presentation"></div>
          <div class="hero-content">
            <h1>RepairQRG</h1>
            <p>Your repair companion</p>
          </div>
        </div>
        <nav class="actions" aria-label="Primary">
          <a class="action-card" href="#repairs">
            <div class="icon" aria-hidden="true">🔧</div>
            <div class="label">Repairs</div>
          </a>
          <a class="action-card" href="#manuals">
            <div class="icon" aria-hidden="true">📘</div>
            <div class="label">Manuals</div>
          </a>
          <a class="action-card" href="#videos">
            <div class="icon" aria-hidden="true">🎬</div>
            <div class="label">Videos</div>
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
